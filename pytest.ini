[pytest]
pythonpath = . packages
asyncio_mode = auto

# Only collect tests from our intended locations. Without this a bare `pytest`
# walks scrapy/ and .venv/.
testpaths = tests services

# Do not impose coverage on partial runs. `scripts/run_all_suites.py` runs each
# suite in its own process, and a global --cov would miss most of them.
addopts = -p no:cacheprovider
