[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicefront-common"
version = "0.1.0"
description = "Shared schemas, exceptions, validators and clients for VoiceFront services"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[tool.setuptools]
packages = ["common_utils", "schemas"]
