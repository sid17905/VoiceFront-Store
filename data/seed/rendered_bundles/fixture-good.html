<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sharma General Store</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 16px; color: #1a1a1a; background: #ffffff; }
    .product { padding: 12px; border: 1px solid #ccc; margin-bottom: 8px; }
    a, button { min-width: 24px; min-height: 24px; display: inline-block; }
  </style>
</head>
<body>
  <header><h1>Sharma General Store</h1></header>
  <main>
    <section aria-label="products">
      <h2>Products</h2>
      <div class="product">
        <img src="https://via.placeholder.com/150" alt="Packet of rice">
        <p>Rice — ₹60/kg</p>
      </div>
    </section>
    <section aria-label="contact">
      <h2>Contact</h2>
      <a href="https://wa.me/919999999999">Message us on WhatsApp</a>
    </section>
  </main>
</body>
</html>
